name: StockExchange Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  lint-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript strict typecheck
        run: npm run typecheck

      - name: Component & unit tests (Vitest + RTL)
        run: npm test

      - name: Production Vite build
        run: npm run build

      - name: Dependency security audit
        run: npm audit --audit-level=high || true

  docker-build-and-scan:
    needs: lint-test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image (local, no push)
        run: docker build -t stockexchange-frontend:ci -f Dockerfile .
      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: stockexchange-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  production-deploy-approval-gate:
    needs: docker-build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production gate placeholder
        run: echo "Protected by GitHub environment reviewers; no unauthorized cloud deployment."
